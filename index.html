<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Cảnh Báo Ngập Lụt Thông Minh</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* ==========================================
           1. CẤU HÌNH BIẾN MÀU SÁNG / TỐI (VARIABLES)
           ========================================== */
        :root {
            /* Mặc định: Giao diện Tối (Dark Mode) */
            --bg-body: #121212;
            --bg-card: #181818;
            --border-color: #282828;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --btn-toggle-bg: #282828;
        }

        /* Khi kích hoạt Giao diện Sáng (Light Mode) */
        body.light-mode {
            --bg-body: #f4f6f8;
            --bg-card: #ffffff;
            --border-color: #e1e4e8;
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --btn-toggle-bg: #e1e4e8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            padding: 0 20px;
        }

        /* HEADER & NÚT CHUYỂN THEME */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--bg-body);
            display: flex;
            align-items: center;
            justify-content: space-between; /* Đẩy logo sang trái, nút theme sang phải */
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            width: 100%;
            margin-bottom: 25px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-icon-wrapper {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 20px rgba(29, 185, 84, 0.25);
            overflow: hidden;
            flex-shrink: 0;
        }

        .brand-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { 
            font-size: 24px; 
            font-weight: 800; 
            line-height: 1.2;
            color: var(--text-primary);
        }

        /* Nút Chuyển Đổi Sáng Tối */
        .theme-toggle-btn {
            background-color: var(--btn-toggle-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px var(--shadow-color);
            outline: none;
        }

        .theme-toggle-btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        @media (max-width: 600px) {
            .brand-icon-wrapper { width: 55px; height: 55px; }
            h1 { font-size: 17px; }
            .theme-toggle-btn { padding: 8px 12px; font-size: 12px; }
        }

        /* BẢN ĐỒ */
        .map-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px var(--shadow-color);
            position: relative;
        }

        #map {
            height: 550px;
            width: 100%;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* LƯỚI KHUNG TRẠM */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .stations-grid { grid-template-columns: 1fr; }
        }

        .station-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 12px var(--shadow-color);
        }

        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .location-info h2 { 
            font-size: 18px; 
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        
        .location-info p { 
            font-size: 14px; 
            color: var(--text-secondary); 
            font-weight: 500;
        }

        .status-badge {
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: var(--btn-toggle-bg);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .station-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            font-size: 14px; 
            color: var(--text-secondary); 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-footer strong {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }

        /* CHÂN TRANG */
        .footer-status-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .system-status {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #1db954;
            border-radius: 50%;
            box-shadow: 0 0 8px #1db954;
        }

        .footer-update { color: var(--text-secondary); font-size: 14px; font-weight: 600; }

        /* LEAFLET CSS & SÓNG CHỚP NHÁY */
        .leaflet-div-icon { 
            background: transparent !important; 
            border: none !important; 
        }

        .sensor-container {
            position: relative;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sensor-core {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }

        .sensor-container::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            opacity: 1;
            z-index: 1;
            animation: pulse-ring 1.3s infinite ease-out;
        }

        .sensor-green .sensor-core { background-color: #1db954; }
        .sensor-green::after { border: 3px solid #1db954; }

        .sensor-orange .sensor-core { background-color: #f39c12; }
        .sensor-orange::after { border: 3px solid #f39c12; }

        .sensor-red .sensor-core { background-color: #e74c3c; }
        .sensor-red::after { border: 3px solid #e74c3c; }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        /* NÚT CHUYỂN BẢN ĐỒ KHÓA TRONG BẢN ĐỒ */
        .leaflet-top { top: 10px !important; }
        .leaflet-right { right: 10px !important; }
        .leaflet-control-layers {
            border-radius: 8px !important;
            box-shadow: 0 4px 12px var(--shadow-color) !important;
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
            font-family: inherit;
        }
        .leaflet-control-layers-list { padding: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <div class="brand-title">
                <div class="brand-icon-wrapper">
                    <!-- ĐƯỜNG DẪN ẢNH TƯƠNG ĐỐI TRONG THƯ MỤC DỰ ÁN -->
                    <img class="brand-logo-img" src="image/3.avif" alt="Logo Dự Án" onerror="this.src='https://via.placeholder.com/150/1db954/ffffff?text=LOGO'">
                </div>
                <h1>Hệ Thống Cảnh Báo Ngập Lụt Thông Minh</h1>
            </div>

            <!-- Nút Chuyển Đổi Chế Độ Sáng / Tối -->
            <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Giao diện Tối</span>
            </button>
        </header>

        <!-- Khung Bản Đồ -->
        <div class="map-card">
            <div id="map"></div>
        </div>

        <!-- Khung Hiển Thị Các Trạm -->
        <div class="stations-grid">
            <!-- TRẠM 1: HẢI PHÒNG -->
            <div class="station-card">
                <div class="station-header">
                    <div class="location-info">
                        <h2>Trạm Hải Phòng</h2>
                        <p>Tọa độ: 20.823905, 106.556187</p>
                    </div>
                    <div class="status-badge" id="status-tag-hp">Đang kết nối...</div>
                </div>
                <div class="station-footer">
                    <span>Thời gian ghi nhận:</span>
                    <strong id="time-hp">--:--:--</strong>
                </div>
            </div>

            <!-- TRẠM 2: HÀ NỘI -->
            <div class="station-card">
                <div class="station-header">
                    <div class="location-info">
                        <h2>Trạm Hà Nội</h2>
                        <p>Tọa độ: 21.028511, 105.854167</p>
                    </div>
                    <div class="status-badge" id="status-tag-hn">Đang kết nối...</div>
                </div>
                <div class="station-footer">
                    <span>Thời gian ghi nhận:</span>
                    <strong id="time-hn">--:--:--</strong>
                </div>
            </div>
        </div>

        <!-- Chân trang -->
        <div class="footer-status-container">
            <div class="system-status">
                <span class="live-dot"></span> ĐANG TRUYỀN DỮ LIỆU SỐ
            </div>
            <div class="footer-update">
                <span id="update-time">Đồng bộ hệ thống lần cuối: Đang tải...</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // CẤU HÌNH XỬ LÝ GIAO DIỆN SÁNG / TỐI (THEME)
        // ==========================================
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const themeBtn = document.getElementById('theme-btn');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Giao diện Sáng';
            } else {
                document.body.classList.remove('light-mode');
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Giao diện Tối';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            const themeIcon = document.getElementById('theme-icon');
            const themeText = document.getElementById('theme-text');

            if (isLight) {
                localStorage.setItem('theme', 'light');
                themeIcon.innerText = '☀️';
                themeText.innerText = 'Giao diện Sáng';
            } else {
                localStorage.setItem('theme', 'dark');
                themeIcon.innerText = '🌙';
                themeText.innerText = 'Giao diện Tối';
            }
        }

        // Chạy hàm kiểm tra theme ngay khi tải trang
        initTheme();

        // ==========================================
        // CẤU HÌNH BẢN ĐỒ LEAFLET & LẤY DỮ LIỆU SHEET
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyh8AGwhdA_h9m6mVvC80pSmZLTurMykJWKOUdRa81qCO3F79w-NYKWHzNNhhAwfUE7/exec";

        const locationHP = [20.823905, 106.556187];
        const locationHN = [21.028511, 105.854167];

        const googleStreet = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        });

        const map = L.map('map', {
            center: [20.92, 106.20],
            zoom: 9,
            layers: [googleStreet]
        });

        const baseMaps = {
            "🗺️ Đường bộ": googleStreet,
            "🛰️ Vệ tinh": googleSatellite
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        let markerHP = null;
        let markerHN = null;

        function renderStation({ location, waterLevel, tagId, timeId, stationTime, currentMarker, stationName }) {
            const level = Number(waterLevel);
            const statusTag = document.getElementById(tagId);
            const timeTag = document.getElementById(timeId);
            
            let colorClass = "";
            let statusText = "";
            let tagColor = "";

            if (level < 10) {
                colorClass = "sensor-green";
                statusText = `Ngập ${level}cm - An toàn`;
                tagColor = "#1db954";
            } else if (level >= 10 && level < 20) {
                colorClass = "sensor-orange";
                statusText = `Ngập ${level}cm - Cảnh báo`;
                tagColor = "#f39c12";
            } else {
                colorClass = "sensor-red";
                statusText = `Ngập ${level}cm - Nguy hiểm`;
                tagColor = "#e74c3c";
            }

            if (statusTag) {
                statusTag.innerText = statusText;
                statusTag.style.color = tagColor;
            }

            if (timeTag && stationTime) {
                timeTag.innerText = stationTime;
            }

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }

            const customIcon = L.divIcon({
                className: '',
                html: `<div class="sensor-container ${colorClass}"><div class="sensor-core"></div></div>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });

            const newMarker = L.marker(location, { icon: customIcon }).addTo(map);
            newMarker.bindPopup(`<b>${stationName}</b><br>Trạng thái: <b>${statusText}</b><br><small>Ghi nhận: ${stationTime || '--'}</small>`);

            return newMarker;
        }

        function fetchSheetData() {
            fetch(GAS_URL, { cache: "no-store" })
                .then(response => response.json())
                .then(data => {
                    const levelHP = data.vacant !== undefined ? data.vacant : 0;
                    const timeHP = (data.time && data.date) ? `${data.time} (${data.date})` : (data.time || '--');

                    const levelHN = data.vacant2 !== undefined ? data.vacant2 : 0;
                    const timeHN = (data.time2 && data.date2) ? `${data.time2} (${data.date2})` : timeHP;

                    markerHP = renderStation({
                        location: locationHP,
                        waterLevel: levelHP,
                        tagId: "status-tag-hp",
                        timeId: "time-hp",
                        stationTime: timeHP,
                        currentMarker: markerHP,
                        stationName: "TRẠM CẢM BIẾN HẢI PHÒNG"
                    });

                    markerHN = renderStation({
                        location: locationHN,
                        waterLevel: levelHN,
                        tagId: "status-tag-hn",
                        timeId: "time-hn",
                        stationTime: timeHN,
                        currentMarker: markerHN,
                        stationName: "TRẠM CẢM BIẾN HÀ NỘI"
                    });

                    const now = new Date();
                    document.getElementById("update-time").innerText = "Đồng bộ hệ thống lần cuối: " + now.toLocaleTimeString('vi-VN');
                })
                .catch(error => console.error("Lỗi kết nối dữ liệu Sheet:", error));
        }

        fetchSheetData();
        setInterval(fetchSheetData, 5000);
    </script>
</body>
</html>
